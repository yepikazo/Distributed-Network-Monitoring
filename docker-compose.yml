services:
  master:
    build: .
    image: netmon-tema13:latest
    hostname: master
    volumes:
      - ./hasil:/app/hasil
      - ./laporan:/app/laporan
    # Buka ini HANYA jika worker berada di luar Docker (mis. 9 laptop lab).
    # ports:
    #   - "9998:9998"
    command:
      - python3
      - master.py
      - --target-source=${TARGET_SOURCE:-workers}
      - --synth=${SYNTH:-0}
      - --count=${COUNT:-1}
      - --timeout=${TIMEOUT:-0.3}
      - --repeat=${REPEAT:-3}
      - --chunk=${CHUNK:-0}
      - --fairness=${FAIRNESS:-count}
      - --mode=${MODE:-dynamic}
      - --expected-workers=${WORKERS:-4}
      - --discovery-timeout=${DISCOVERY_TIMEOUT:-30}
      - --grace=1
      - --max-runtime=${MAX_RUNTIME:-300}
      - --run-tag=${TAG:-docker}
      - --out=/app/hasil
      - --events=/app/laporan/events_${TAG:-docker}.jsonl

  worker:
    build: .
    image: netmon-tema13:latest
    depends_on:
      - master
    deploy:
      replicas: ${WORKERS:-4}
    command:
      - python3
      - worker.py
      - --master=master
      - --port=9998
      - --cores=${WORKER_CORES:-1}
      - --hb-interval=1
      - --no-reconnect
